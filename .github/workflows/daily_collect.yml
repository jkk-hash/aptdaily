name: Daily Apartment Transaction Collection

on:
  schedule:
    # 매일 UTC 17:00 (한국 시간 KST 02:00) 실행
    - cron: '0 17 * * *'
  workflow_dispatch: # 수동 즉시 실행 지원

permissions:
  contents: write

jobs:
  collect-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      - name: Run collector
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: uv run python src/collector.py

      - name: Commit and push if data changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_7days.parquet data/metadata.json
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): auto update apartment transactions $(date +'%Y-%m-%d') [skip ci]"
            git push
          fi
